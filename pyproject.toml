[project]
name = "mcpx"
version = "0.1.0"
description = "Benchmark harness comparing MCP tool-calling with code execution"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-adk",
    "litellm",
    "mcp",
    "psutil",
    "python-dotenv",
]

[project.scripts]
mcpx = "mcpx.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "anyio",
    "ruff",
    "pyrefly",
    "types-psutil",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpx"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "live: tests that call real LLM or network services (need OPENROUTER_API_KEY)",
]

[tool.ruff]
line-length = 88
# Ruff formats Python code blocks inside Markdown; keep it off the plan and spec.
extend-exclude = ["docs"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
