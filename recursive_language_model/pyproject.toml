[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rlm"
version = "0.1.0"
description = "Recursive Language Model agent with context-by-reference recursion"
requires-python = ">=3.11"
dependencies = [
    "openai-agents",
    "pydantic>=2.0",
    "click>=8.0",
    "rich>=13.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "anyio[trio]>=4.0",
    "ruff>=0.15.10",
]

[project.scripts]
rlm = "rlm.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rlm"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[dependency-groups]
dev = [
    "anyio[trio]>=4.0",
    "click>=8.4.1",
    "pyrefly>=1.0.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.14",
]
