[project]
name = "harness-builder"
version = "0.1.0"
description = "Layered agent-harness framework and generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4",
    "click>=8.0",
    "codeact-agent",
    "google-adk>=1.0.0,<2.0.0",
    "litellm>=1.50",
    "pydantic>=2.0",
    "pyrefly>=1.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "ruff>=0.15",
    "skillful-agent",
]

[project.scripts]
harness = "harness_builder.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_builder"]

[tool.ruff]
line-length = 88
extend-exclude = [
    "harnesses/",
    ".harness/",
    ".agents/",
    "tests/generator/fixtures/broken_*/",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pyrefly]
project-includes = ["src", "tests"]
project-excludes = [
    "**/harnesses/**",
    "**/.harness/**",
    "**/.agents/**",
    "**/tests/generator/fixtures/broken_*/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
markers = [
    "docker: needs a running Docker daemon",
    "live: needs a real LLM (HARNESS_LIVE=1)",
]

[tool.uv.sources]
skillful-agent = { path = "../skillful_agent", editable = true }
codeact-agent = { path = "../codeact_agent", editable = true }

[dependency-groups]
dev = [
    "anyio>=4",
    "pytest>=8",
    "pytest-timeout>=2.4.0",
]
