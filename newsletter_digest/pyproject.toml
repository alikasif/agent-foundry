[project]
name = "newsletter-digest"
version = "0.1.0"
description = "Turn a Gmail newsletter label into a ranked, de-duplicated HTML reading list."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.15.1",
    "click>=8.5.0",
    "deepagents>=0.7.32",
    "httpcore>=1.0.9,<2",
    "httpx>=0.28.1,<0.29",
    "jinja2>=3.1.6",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.7.3",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "trafilatura>=2.3.1",
]

[project.scripts]
newsletter-digest = "newsletter_digest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsletter_digest"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["newsletter_digest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (require Gmail OAuth, npx and OpenRouter)",
]
addopts = "-m 'not integration'"

[tool.pyrefly]
project-includes = ["src", "tests"]
search-path = ["."]

[dependency-groups]
dev = [
    "anyio[trio]>=4.15.1",
    "pyrefly>=1.4.0",
    "pytest>=9.2.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.3",
]
